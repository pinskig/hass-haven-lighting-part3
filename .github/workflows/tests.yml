name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Client and adapter regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  home-assistant:
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2024.1.0"
            python: "3.11"
            requirements: tests/requirements-ha-min.txt
            override: --override tests/requirements-ha-min-overrides.txt
          - ha: "2026.10.4"
            python: "3.14"
            requirements: tests/requirements-ha-current.txt
            override: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.5
      - name: Install pinned framework and fixtures
        run: uv pip install --system ${{ matrix.override }} -r ${{ matrix.requirements }}
      - name: Run with real Home Assistant and blocked network sockets
        run: python -m pytest tests/ha -v
